[project]
name = "image-search"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "aiortc>=1.14.0,<2.0.0",
    "faiss-cpu==1.9.0",
    "fastapi>=0.135.0,<0.137.0",
    "hf-xet==1.1.10",
    "huggingface-hub",
    "nuitka>=4.2.2",
    "numpy==1.26.4",
    "open-clip-torch",
    "opentelemetry-api==1.35.0",
    "opentelemetry-exporter-otlp==1.35.0",
    "opentelemetry-exporter-otlp-proto-http==1.35.0",
    "opentelemetry-instrumentation==0.56b0",
    "opentelemetry-sdk==1.35.0",
    "pillow==11.2.1",
    "pillow-heif==1.3.0",
    "pipdeptree>=4.2.5",
    "profilehooks>=1.13.0",
    "psutil>=7.0.0,<8.0.0",
    "pyinstaller>=6.22.3",
    "pymobiledevice3<4.0.0",
    "pyobjc-framework-cocoa>=12.2,<13 ; sys_platform == 'darwin'",
    "pyobjc-framework-systemconfiguration>=12.2,<13 ; sys_platform == 'darwin'",
    "pyqtinspect>=0.5.0",
    "pyside6==6.9.0",
    "pystray>=0.19,<1.0",
    "pywebview>=5.0,<6.0",
    "pytest>=9.1.1",
    "qrcode==8.2",
    "requests>=2.32.4,<3.0.0",
    "tomlkit>=0.15.1",
    "torch==2.2.2",
    "torchvision==0.17.2",
    "tqdm==4.67.1",
    "transformers>=4.57.1,<5.0.0",
    "uvicorn>=0.44.0,<0.45.0",
    "viztracer>=1.1.1",
    "watchdog==6.0.0",
    "websockets>=16.0,<17.0",
    "zeroconf>=0.130.0",
]

[tool.uv.workspace]
exclude = ["dt_image_search/third-party/*"]
members = [
    "dt_image_search/third-party/huggingface_hub-0.36.0",
    "dt_image_search/third-party/open_clip-2.26.1",
]

[tool.uv.sources]
open-clip-torch = { path = "dt_image_search/third-party/open_clip-2.26.1", editable = true }
huggingface-hub = { path = "dt_image_search/third-party/huggingface_hub-0.36.0", editable = true }
